name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore: &documentation-only
      - "**/*.md"
      - "**/*.avif"
      - "**/*.bmp"
      - "**/*.gif"
      - "**/*.ico"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.tif"
      - "**/*.tiff"
      - "**/*.webp"
  pull_request:
    paths-ignore: *documentation-only

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build pipx twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install application with pipx
        run: pipx install dist/*.whl
      - name: Installed-application smoke test
        run: |
          EXPECTED_VERSION=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          pipx list | grep -q "package wazuhscatune $EXPECTED_VERSION"
          wazuhscatune >/tmp/wazuhscatune.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wazuhscatune.log
          exit 1
