name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publishing must be triggered from main."
            exit 1
          fi

      - name: Read package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - name: Installed-wheel smoke test
        run: |
          cd /tmp
          python - <<'PY'
          from importlib.metadata import version
          from sca.app import create_app

          expected = "${{ steps.version.outputs.version }}"
          assert version("wazuhscatune") == expected
          app = create_app()
          response = app.test_client().get("/")
          assert response.status_code == 200
          PY

      - name: Create version tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          CURRENT_SHA=$(git rev-parse HEAD)
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$CURRENT_SHA" ]; then
              echo "$TAG already points to $TAG_SHA, not $CURRENT_SHA."
              exit 1
            fi
            echo "$TAG already points to this commit; continuing."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
