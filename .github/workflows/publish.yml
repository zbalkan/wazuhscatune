name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          actual = '${{ github.ref_name }}'
          if actual != expected:
              raise SystemExit(f'tag {actual!r} does not match project version {expected!r}')
          PY
      - name: Build
        run: python -m build
      - name: Validate
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wazuhscatune
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
