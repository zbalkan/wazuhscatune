[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhscatune"
version = "0.2.0"
description = "Tailor Wazuh SCA baselines with documented exceptions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "Flask==3.0.0",
  "Flask-Session==0.5.0",
  "ruamel.yaml==0.18.6",
  "Werkzeug==3.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.9", "pycodestyle>=2.11"]

[project.scripts]
wazuhscatune = "sca.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sca*"]

[tool.setuptools.package-data]
sca = ["templates/**/*.html", "static/**/*.css", "static/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["sca/tests"]
